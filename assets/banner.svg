<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <!-- Animated Node Glow Filter -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      fill: url(#title-grad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-bg {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1.5px;
      rx: 20px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }

    /* Dynamic / Animated Keyframes */
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 12px #818cf8); }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .anim-node {
      transform-origin: center;
      animation: pulse-node 4s ease-in-out infinite;
    }
    .anim-node-delayed {
      transform-origin: center;
      animation: pulse-node 4s ease-in-out infinite;
      animation-delay: 2s;
    }
    .anim-line {
      stroke-dasharray: 8 6;
      animation: dash-flow 20s linear infinite;
    }
    .floating-card {
      animation: float-slow 6s ease-in-out infinite;
    }
  </style>

  <!-- Base Layer: Solid & Gradient Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Background Decorative Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)" />
  </g>

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Layered BEHIND foreground text) -->
  <g id="dynamic-network-background" opacity="0.45">
    <!-- Network Connection Lines -->
    <path class="anim-line" d="M 900 80 L 1050 140 L 980 260 L 850 200 Z" stroke="#6366f1" stroke-width="2" fill="none" />
    <path class="anim-line" d="M 1050 140 L 1140 220 L 980 260" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <path class="anim-line" d="M 150 280 L 260 210 L 180 120" stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.6" />

    <!-- Animated Network Nodes -->
    <circle cx="900" cy="80" r="7" fill="#38bdf8" class="anim-node" />
    <circle cx="1050" cy="140" r="9" fill="#818cf8" class="anim-node-delayed" />
    <circle cx="980" cy="260" r="8" fill="#c084fc" class="anim-node" />
    <circle cx="850" cy="200" r="6" fill="#f472b6" class="anim-node-delayed" />
    <circle cx="1140" cy="220" r="7" fill="#38bdf8" class="anim-node" />

    <!-- Ambient Glowing Orbs -->
    <circle cx="980" cy="180" r="140" fill="url(#glow-grad)" filter="url(#blur-glow)" />
    <circle cx="150" cy="100" r="100" fill="url(#glow-grad)" filter="url(#blur-glow)" />
  </g>

  <!-- FOREGROUND LAYER: Content, Title, Subtitle, Badges (Guaranteed top-level z-index) -->
  <g id="foreground-content">
    <!-- Top Pill / Badge -->
    <g class="floating-card" transform="translate(80, 50)">
      <rect class="badge-bg" width="310" height="34" x="0" y="0" />
      <text class="badge-text" x="18" y="22">🌐 ENTERPRISE DIGITAL WORKPLACE</text>
    </g>

    <!-- Main Title -->
    <text class="title-text" x="80" y="135">Awesome Enterprise Social Network</text>

    <!-- Subtitle -->
    <text class="subtitle-text" x="80" y="175">Curated directory of SaaS products &amp; open-source platforms for enterprise engagement</text>

    <!-- Category Highlights Badges -->
    <g transform="translate(80, 215)">
      <!-- Item 1: Internal Comms -->
      <g transform="translate(0, 0)">
        <rect class="badge-bg" width="180" height="38" rx="8" />
        <text font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" x="16" y="24">📢 Internal Comms</text>
      </g>
      <!-- Item 2: Employee Engagement -->
      <g transform="translate(195, 0)">
        <rect class="badge-bg" width="200" height="38" rx="8" />
        <text font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" x="16" y="24">🚀 Employee Engagement</text>
      </g>
      <!-- Item 3: Open-Source Intranets -->
      <g transform="translate(410, 0)">
        <rect class="badge-bg" width="200" height="38" rx="8" />
        <text font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" x="16" y="24">🔓 Open-Source Intranets</text>
      </g>
    </g>

    <!-- Footer Stats / Meta line inside banner -->
    <g transform="translate(80, 290)">
      <text font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
        Updated October 2026 • 20+ Platforms Tracked • GDPR &amp; Async Workplace Ready
      </text>
    </g>
  </g>
</svg>
